name: Bug
description: Something doesn't work the way it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Tap …
        3. See …
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: App version, device and OS, browser, or URL.
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Remove passwords, tokens and personal data first.
