name: Feature or improvement
description: Something new, or something that could work better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who runs into this, and what gets in their way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change. Rough is fine.
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How we'll know it works.
